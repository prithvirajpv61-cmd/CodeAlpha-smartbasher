<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <g transform="translate(200, 180)">
    <!-- Box / Product container -->
    <rect x="20" y="50" width="160" height="150" rx="16" fill="#cbd5e1" opacity="0.6" />
    <path d="M50 50 L100 10 L150 50 Z" fill="#94a3b8" opacity="0.4" />
    <circle cx="100" cy="120" r="35" fill="url(#iconGrad)" />
    <!-- ShopEase bag silhouette -->
    <path d="M90 120 C90 114 94 110 100 110 C106 110 110 114 110 120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <rect x="86" y="120" width="28" height="20" rx="3" fill="#ffffff" />
  </g>
  <text x="300" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle">ShopEase Premium Product</text>
  <text x="300" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Verified Authentic Quality</text>
</svg>
