<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Bag Icon -->
  <g transform="translate(10, 8)">
    <rect x="4" y="14" width="36" height="30" rx="8" fill="url(#logoGrad)" />
    <!-- Bag Handle -->
    <path d="M14 14V10C14 5.58 17.58 2 22 2C26.42 2 30 5.58 30 10V14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Smile swoop inside bag -->
    <path d="M13 28C17 34 27 34 31 28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="31" cy="28" r="2" fill="#ffffff" />
    <!-- Sparkle -->
    <circle cx="38" cy="14" r="3" fill="#facc15" />
  </g>
  <!-- Text Brand -->
  <text x="62" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Shop<tspan fill="#6366f1">Ease</tspan></text>
  <!-- Tagline dot -->
  <circle cx="188" cy="35" r="4" fill="url(#accentGrad)" />
</svg>
